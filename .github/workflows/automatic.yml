name: TrendPulse AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10,17 * * *'

permissions:
  contents: read

jobs:
  trendpulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run TrendPulse AI
        run: python main.py

      - name: Save trending topics
        uses: actions/upload-artifact@v4
        with:
          name: trending-topics
          path: trends.json
          retention-days: 3
