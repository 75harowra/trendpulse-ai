name: TrendPulse AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10,17 * * *'

permissions:
  contents: read

jobs:
  trendpulse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser edge-tts openai pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Find trending topics
        run: python main.py

      - name: Generate video scripts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python writer.py

      - name: Generate voice
        run: python voice.py

      - name: Generate videos
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python video.py

      - name: Upload trending topics
        uses: actions/upload-artifact@v4
        with:
          name: trending-topics
          path: |
            trends.json
            trending_topics.json
            topics.json

      - name: Upload scripts
        uses: actions/upload-artifact@v4
        with:
          name: video-scripts
          path: scripts.json

      - name: Upload audio
        uses: actions/upload-artifact@v4
        with:
          name: video-audio
          path: audio/

      - name: Upload finished videos
        uses: actions/upload-artifact@v4
        with:
          name: finished-videos
          path: videos/
